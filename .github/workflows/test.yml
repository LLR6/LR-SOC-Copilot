name: Test
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m pip install "jsonschema>=4.23"
      - name: CLI version smoke test
        run: soc-copilot --version
      - run: python -m unittest discover -s tests
      - name: Coverage snapshot
        run: |
          python -m pip install "coverage>=7.6"
          coverage run -m unittest discover -s tests -v
          coverage report -m
          coverage xml -o coverage.xml
      - uses: actions/upload-artifact@v4
        with:
          name: LR-SOC-Copilot-coverage-${{ matrix.python-version }}
          path: coverage.xml
      - name: Build case-report JSON
        run: soc-copilot examples/alerts.jsonl --runbooks runbooks --format json --output case-report.json
      - name: Validate case-report schema
        run: python scripts/validate_json_schema.py schemas/case-report.schema.json case-report.json
      - name: Compile package
        run: python -m compileall -q src
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Validate JSON Schemas
        shell: bash
        run: |
          if compgen -G "schemas/*.json" > /dev/null; then
            for f in schemas/*.json; do python -m json.tool "$f" > /dev/null; done
          fi
      - name: Evaluate runbook retrieval
        run: python scripts/evaluate_retrieval.py benchmarks/retrieval.json --output retrieval-benchmark.json --fail-on-regression
      - name: Hash retrieval benchmark
        run: sha256sum retrieval-benchmark.json > retrieval-benchmark.json.sha256
      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv /tmp/lr-wheel-smoke
          /tmp/lr-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/lr-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/lr-wheel-smoke/bin/soc-copilot --version
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soc-copilot-retrieval-benchmark-${{ matrix.python-version }}
          path: |
            retrieval-benchmark.json
            retrieval-benchmark.json.sha256
