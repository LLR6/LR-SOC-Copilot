name: Test
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Check release metadata consistency
        run: python scripts/check_release_metadata.py
      - name: Check local documentation links
        run: python scripts/check_local_links.py
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Compile package
        run: python -m compileall -q src/soc_copilot
      - name: Smoke-test installed CLI
        run: soc-copilot --help > /dev/null
      - run: python -m pip install "jsonschema>=4.23"
      - name: CLI version smoke test
        run: soc-copilot --version
      - run: python -m unittest discover -s tests
      - name: Coverage snapshot
        run: |
          python -m pip install "coverage>=7.6"
          coverage run --source=src/soc_copilot -m unittest discover -s tests -v
          coverage report -m --fail-under=50
          coverage xml -o coverage.xml
      - uses: actions/upload-artifact@v7
        with:
          name: LR-SOC-Copilot-coverage-${{ matrix.python-version }}
          path: coverage.xml
      - name: Build case-report JSON
        run: soc-copilot examples/alerts.jsonl --runbooks runbooks --format json --output case-report.json
      - name: Validate case-report schema
        run: python scripts/validate_json_schema.py schemas/case-report.schema.json case-report.json
      - name: Compile package
        run: python -m compileall -q src
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Validate JSON Schemas
        shell: bash
        run: |
          if compgen -G "schemas/*.json" > /dev/null; then
            for f in schemas/*.json; do python -m json.tool "$f" > /dev/null; done
          fi
      - name: Evaluate runbook retrieval
        run: python scripts/evaluate_retrieval.py benchmarks/retrieval.json --output retrieval-benchmark.json --fail-on-regression
      - name: Performance smoke
        run: python scripts/perf_smoke.py examples/alerts.jsonl --runbooks runbooks --repeats 5 --output performance-smoke.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: soc-copilot-performance-smoke-${{ matrix.python-version || 'default' }}
          path: performance-smoke.json

      - name: Hash retrieval benchmark
        run: sha256sum retrieval-benchmark.json > retrieval-benchmark.json.sha256
      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv /tmp/lr-wheel-smoke
          /tmp/lr-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/lr-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/lr-wheel-smoke/bin/soc-copilot --version
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: soc-copilot-retrieval-benchmark-${{ matrix.python-version }}
          path: |
            retrieval-benchmark.json
            retrieval-benchmark.json.sha256
