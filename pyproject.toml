[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="lr-soc-copilot"
version="0.1.0"
description="Evidence-grounded alert correlation and local runbook retrieval for SOC investigation"
requires-python=">=3.10"
[project.scripts]
soc-copilot="soc_copilot.cli:main"
[tool.setuptools.packages.find]
where=["src"]
